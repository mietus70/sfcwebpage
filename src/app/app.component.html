<a href="#main-content" class="sfc-skip-link">Przejdź do treści</a>

<app-header></app-header>

<div class="breadcrumb" *ngIf="myRouterService.url!='/' && myRouterService.url!=='/#/'">
  <div class="container">
    <li class="bread"
        *ngFor="let url_item of myRouterService.url.split('/'); let i=index">
      <a *ngIf="i === 0" routerLink="/">
        Strona główna
      </a>

      <a *ngIf="i > 0 && i < myRouterService.urlLength -1"
         routerLink="{{getBreadcrumbElements(i+1)}}">
        {{url_item}}
      </a>

      <a *ngIf="i === myRouterService.urlLength -1">
        {{url_item}}
      </a>
    </li>
  </div>
</div>

<!-- Spacer for fixed header on subpages (mobile) -->
<div class="sfc-subpage-spacer"
     *ngIf="myRouterService.url!='/' && myRouterService.url!=='/#/'"></div>

<div class="container search-class sfc-page-enter" id="main-content">
  <router-outlet></router-outlet>
</div>

<app-footer></app-footer>

<!-- Scroll to top button -->
<button class="sfc-scroll-top" [class.sfc-scroll-top--visible]="showScrollTop"
        (click)="scrollToTop()" aria-label="Wróć na górę">
  <i class="fa fa-chevron-up"></i>
</button>

<!-- Cookie banner -->
<div class="sfc-cookie-banner" *ngIf="showCookieBanner">
  <div class="sfc-cookie-banner__inner">
    <div class="sfc-cookie-banner__text">
      <i class="fa fa-info-circle"></i>
      <span>
        Ta strona używa plików cookie w celu zapewnienia najlepszej jakości usług.
        Korzystając ze strony wyrażasz zgodę na ich używanie.
        <a routerLink="/rodo">Polityka prywatności</a>
      </span>
    </div>
    <button class="sfc-cookie-banner__btn" (click)="acceptCookies()">Akceptuję</button>
  </div>
</div>
