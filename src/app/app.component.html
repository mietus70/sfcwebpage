<app-header></app-header>
<div class="breadcrumb" *ngIf="myRouterService.url!='/'">
  <li class="bread"
      *ngFor="let url_item of myRouterService.url.split('/'); let i=index">
    <a *ngIf="i === 0" routerLink="/">
      Home
    </a>

    <a *ngIf="i > 0 && i < myRouterService.urlLength -1"
       routerLink="{{getBreadcrumbElements(i+1)}}">
      {{url_item}}
    </a>

    <a *ngIf="i === myRouterService.urlLength -1">
      {{url_item}}
    </a>

  </li>
</div>
<div class="container search-class" style="padding-top: 2em;">
  <router-outlet></router-outlet>
</div>
<app-footer></app-footer>
