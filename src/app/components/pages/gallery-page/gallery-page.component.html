<div
  class="blogger"
  *ngIf="ngxGalleryService.galleries && ngxGalleryService.galleries[0].galleryTitle && ngxGalleryService.galleries[0].galleryOptions && ngxGalleryService.galleries[0].galleryImages"
>
  <h1 class="no-margin push-down-10">{{ngxGalleryService.galleries[0].galleryTitle}}</h1>
  <div class="border-red "></div>
</div>
<div style="text-align: center; width: 100%;" class="pull-down-60" *ngIf="ngxGalleryService.galleries">
  <ngx-gallery
    style="margin: auto;"
    class="pull-down-60"
    [options]="ngxGalleryService.galleries[0].galleryOptions" [images]="ngxGalleryService.galleries[0].galleryImages"
  ></ngx-gallery>
</div>
