<div class="container blogger">
  <div class="row">
    <div class="col-md-9 pull-down-70">
      <h1>FAQ</h1>
      <div class="border-red"></div>
      <!-- /.border-red -->

      <!-- /.row -->
      <div class="row" *ngFor="let faq of faqs;">
        <div class="col-md-12  pull-down-30">

          <div class="row">
            <div class="number-article">
              <h4 class="">{{faq.id + 1}}</h4>
            </div>
            <div class="col-md-11">
              <h5 class="pull-down-10"><strong>{{faq.title}}</strong></h5>
              <span [innerHTML]='faq.content'></span>
            </div>
            <!-- /.col-md-7 -->
          </div>
          <!-- /.row -->
        </div>
      </div>

    </div>
    <!-- /.col-md-9 -->
    <div class="col-md-3 sidebar pull-down-90 ">
      <!--Miejsce na widgety-->
    </div>
    <!-- /.col-md-3 -->
  </div>
  <!-- /.row -->

</div>
<!-- /.container -->
