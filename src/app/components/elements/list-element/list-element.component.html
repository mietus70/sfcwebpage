<div class="container blogger">
  <div class="row">
    <div class="col-md-9">
      <h1>{{list.title}}</h1>
      <div class="border-green"></div>
      <!-- /.border-green -->
      <div class="pull-down-25" *ngIf="list.description != null">
        <span [innerHTML]="list.description"></span>
      </div>
      <!-- /.row -->
      <div class="row" *ngFor="let element of list.elements; let i = index">
        <div class="col-md-12  pull-down-30">

          <div class="row">
            <div class="number-article">
              <h4 class="">{{i + 1}}</h4>
            </div>
            <div class="col-md-11">
              <h5 class="pull-down-10"><strong>{{element.title}}</strong></h5>
              <span [innerHTML]="element.content"></span>
            </div>
            <!-- /.col-md-7 -->
          </div>
          <!-- /.row -->
        </div>
      </div>

    </div>
    <!-- /.col-md-9 -->
    <div class="col-md-3 sidebar pull-down-90 ">
      <!--Miejsce na widgety-->
    </div>
    <!-- /.col-md-3 -->
  </div>
  <!-- /.row -->

</div>
<!-- /.container -->
