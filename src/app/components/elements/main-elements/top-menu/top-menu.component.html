<div class="header-holder">
  <div class="container">
    <div class="row header">
      <div class="col-md-2 logo align-c">
        <div class="inner-top-bottom-20">
          <h1 class="no-margin">Fitness</h1>
        </div><!-- /.inner-top-bottom-10 -->
      </div>
      <!-- /.col-md-2 logo -->
      <div class="col-md-10 col-md-xs-12 navigation-holder">
        <div class="inner-top-bottom-10 ">
              <span class="open-navigation js-open-navigation">
                 Navigation
               </span>
          <ul class="main-navigation">

            <li class="bread">
              <a routerLink="{{myRouter.url}}">
                <span *ngIf="myRouter.url === '/'">HOME</span>
                <span *ngIf="myRouter.url != '/'">{{myRouter.url}}</span>
              </a>
            </li>

            <li routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ><a routerLink="/">HOME</a></li>
            <li routerLinkActive="active"><a routerLink="/oferta">OFERTA</a></li>
            <li routerLinkActive="active"><a routerLink="/cennik">CENNIK</a></li>
            <li routerLinkActive="active"><a routerLink="/galeria">GALERIA</a></li>
            <li routerLinkActive="active"><a routerLink="/kontakt">KONTAKT</a></li>
            <li routerLinkActive="active"><a routerLink="/faq">FAQ</a></li>
            <li routerLinkActive="active"><a routerLink="/grafik">GRAFIK</a></li>
          </ul>
        </div><!-- /.inner-top-bottom-10 -->
      </div>
      <!-- /.col-md-10 align-r -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container -->
</div>
<!-- /.header-holder absolute -->
