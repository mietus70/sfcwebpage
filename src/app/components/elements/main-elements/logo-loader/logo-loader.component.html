<div class="silka-loader" [class.silka-loader--hidden]="hidden">
  <div class="silka-loader__content">
    <!-- Animated logo -->
    <div class="silka-loader__logo">
      <svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg" class="silka-loader__svg">
        <g class="silka-loader__dumbbell">
          <rect x="2" y="18" width="4" height="12" rx="2" fill="#FF6B35" opacity="0.7"/>
          <rect x="8" y="14" width="6" height="20" rx="2.5" fill="#FF6B35" opacity="0.85"/>
          <rect x="16" y="10" width="8" height="28" rx="3" fill="#FF6B35"/>
          <rect x="26" y="6" width="12" height="36" rx="4" fill="#FF6B35"/>
          <rect x="26" y="20" width="40" height="6" rx="2" fill="#FF6B35"/>
        </g>
        <text x="72" y="38" font-family="'Poppins', sans-serif" font-weight="900" font-size="28" letter-spacing="-1" fill="#FFFFFF" class="silka-loader__text">SIŁKA</text>
      </svg>
    </div>
    <div class="silka-loader__bar">
      <div class="silka-loader__progress"></div>
    </div>
    <p class="silka-loader__hint">Ładowanie...</p>
  </div>
</div>
