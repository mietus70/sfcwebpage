<div class="sfc-hero">
  <!-- Background slides -->
  <div class="sfc-hero__slides">
    <div class="sfc-hero__slide sfc-hero__slide--active" data-slide="0">
      <img src="assets/img/slider/slide_1.jpg" alt="SFC 24 - Siłownia 24/7">
    </div>
    <div class="sfc-hero__slide" data-slide="1">
      <img src="assets/img/slider/slide_3.jpg" alt="Trening grupowy w SFC 24">
    </div>
    <div class="sfc-hero__slide" data-slide="2">
      <img src="assets/img/slider/slide_4.jpg" alt="Crossfit i zajęcia w SFC 24">
    </div>
  </div>

  <!-- Dark overlay gradient -->
  <div class="sfc-hero__overlay"></div>

  <!-- Content -->
  <div class="sfc-hero__content">
    <div class="sfc-hero__badge">
      <i class="fa fa-clock-o"></i> Otwarte 24/7
    </div>
    <h1 class="sfc-hero__title">
      Twoja siłownia.<br>
      <span class="sfc-hero__title--accent">Twój czas.</span>
    </h1>
    <p class="sfc-hero__subtitle">
      Klub bezobsługowy z dostępem przez całą dobę.
      Siłownia, crossfit, boks, MMA i zajęcia grupowe w 4 lokalizacjach.
    </p>
    <div class="sfc-hero__actions">
      <a routerLink="/cennik" class="sfc-hero__btn sfc-hero__btn--primary">
        <i class="fa fa-bolt"></i> Zobacz cennik
      </a>
      <a routerLink="/kontakt" class="sfc-hero__btn sfc-hero__btn--outline">
        <i class="fa fa-map-marker"></i> Znajdź nas
      </a>
    </div>

    <!-- Quick stats -->
    <div class="sfc-hero__stats">
      <div class="sfc-hero__stat">
        <span class="sfc-hero__stat-number">4</span>
        <span class="sfc-hero__stat-label">Lokalizacje</span>
      </div>
      <div class="sfc-hero__stat-divider"></div>
      <div class="sfc-hero__stat">
        <span class="sfc-hero__stat-number">24h</span>
        <span class="sfc-hero__stat-label">Dostęp</span>
      </div>
      <div class="sfc-hero__stat-divider"></div>
      <div class="sfc-hero__stat">
        <span class="sfc-hero__stat-number">6+</span>
        <span class="sfc-hero__stat-label">Typów zajęć</span>
      </div>
    </div>
  </div>

  <!-- Slide indicators -->
  <div class="sfc-hero__indicators">
    <button class="sfc-hero__dot sfc-hero__dot--active" data-slide="0" aria-label="Slide 1"></button>
    <button class="sfc-hero__dot" data-slide="1" aria-label="Slide 2"></button>
    <button class="sfc-hero__dot" data-slide="2" aria-label="Slide 3"></button>
  </div>

  <!-- Scroll indicator -->
  <div class="sfc-hero__scroll">
    <span>Przewiń</span>
    <div class="sfc-hero__scroll-line"></div>
  </div>
</div>
