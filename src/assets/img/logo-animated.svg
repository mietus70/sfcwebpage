<svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="siłka animated logo">
  <style>
    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.9; filter: brightness(1.15); }
    }
    @keyframes textIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .dumbbell { animation: lift 1.8s ease-in-out infinite; transform-origin: center; }
    .dumbbell-plate { animation: pulse 1.8s ease-in-out infinite; }
    .text-main { animation: textIn 0.6s ease-out 0.2s both; }
    /* Hover variant - pause by default, play on hover */
    .hover-lift:hover .dumbbell { animation-play-state: running; }
  </style>
  <g class="dumbbell">
    <g transform="translate(0, 6)">
      <rect class="dumbbell-plate" x="1" y="10" width="3" height="10" rx="1" fill="#FF6B35" opacity="0.7"/>
      <rect class="dumbbell-plate" x="5.5" y="7" width="4.5" height="16" rx="1.5" fill="#FF6B35" opacity="0.85" style="animation-delay:0.1s"/>
      <rect class="dumbbell-plate" x="11.5" y="4" width="6.5" height="22" rx="2" fill="#FF6B35" style="animation-delay:0.15s"/>
      <rect class="dumbbell-plate" x="19.5" y="1" width="9" height="28" rx="2.5" fill="#FF6B35" style="animation-delay:0.2s"/>
      <rect x="19.5" y="12" width="18" height="5" rx="1" fill="#FF6B35"/>
    </g>
  </g>
  <g class="text-main">
    <text x="42" y="33" font-family="'Poppins', Inter, sans-serif" font-weight="900" font-size="30" letter-spacing="-1" fill="#FFFFFF">SIŁKA</text>
  </g>
</svg>
