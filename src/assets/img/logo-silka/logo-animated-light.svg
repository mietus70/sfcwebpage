<svg width="400" height="96" viewBox="0 0 400 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="siłka animated light">
  <style>
    @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes glow { 0%,100%{filter:drop-shadow(0 0 0 rgba(255,107,53,0))} 50%{filter:drop-shadow(0 0 10px rgba(255,107,53,0.5))} }
    @keyframes reveal { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
    .dumbbell { animation: lift 2s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .text { animation: reveal 0.7s ease-out 0.2s both; }
  </style>
  <g class="dumbbell glow" transform="translate(0,12)">
    <rect x="2" y="20" width="6" height="20" rx="2" fill="#FF6B35" opacity="0.7"/>
    <rect x="11" y="14" width="9" height="32" rx="3" fill="#FF6B35" opacity="0.85"/>
    <rect x="23" y="8" width="13" height="44" rx="4" fill="#FF6B35"/>
    <rect x="39" y="2" width="18" height="56" rx="5" fill="#FF6B35"/>
    <rect x="39" y="24" width="36" height="10" rx="2" fill="#FF6B35"/>
  </g>
  <g class="text">
    <text x="84" y="66" font-family="'Poppins', sans-serif" font-weight="900" font-size="60" letter-spacing="-2">
      <tspan fill="#1E293B">SIŁ</tspan><tspan fill="#FF6B35">KA</tspan>
    </text>
  </g>
</svg>
