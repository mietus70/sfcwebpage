<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>siłka – loader demo</title>
<style>
  body{margin:0;font-family:Inter,sans-serif;background:#F9FAFB}
  .demo-bar{padding:1rem;background:#1E293B;color:white;text-align:center;font-family:Poppins,sans-serif}
  .demo-bar button{margin-left:1rem;padding:.5rem 1rem;background:#FF6B35;color:white;border:none;border-radius:6px;font-weight:700;cursor:pointer}
  .content{padding:4rem 2rem;text-align:center;max-width:600px;margin:0 auto}
  /* Loader styles - copy from logo-loader.component.css */
  .silka-loader{position:fixed;inset:0;z-index:9999;background:#1E293B;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s ease}
  .silka-loader--hidden{opacity:0;visibility:hidden;pointer-events:none}
  .silka-loader__content{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
  .silka-loader__dumbbell{animation:silka-lift 1.2s ease-in-out infinite}
  @keyframes silka-lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .silka-loader__bar{width:120px;height:3px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
  .silka-loader__progress{height:100%;width:40%;background:#FF6B35;border-radius:999px;animation:silka-progress 1.5s ease-in-out infinite}
  @keyframes silka-progress{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .silka-loader__hint{font-size:.75rem;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="demo-bar">
  Loader demo – siłka <button onclick="showLoader()">Pokaż loader (1.5s)</button>
</div>

<div class="content">
  <h1 style="font-family:Poppins,sans-serif;font-weight:800">Strona główna (demo)</h1>
  <p style="color:#6B7280;margin-top:1rem">Loader pojawia się przy pierwszym wejściu, potem znika. Zaimplementowany jako &lt;app-logo-loader&gt; w app.component.html</p>
  <p style="margin-top:2rem"><code>src/app/components/elements/main-elements/logo-loader/</code></p>
</div>

<div class="silka-loader" id="loader">
  <div class="silka-loader__content">
    <svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
      <g class="silka-loader__dumbbell">
        <rect x="2" y="18" width="4" height="12" rx="2" fill="#FF6B35" opacity="0.7"/>
        <rect x="8" y="14" width="6" height="20" rx="2.5" fill="#FF6B35" opacity="0.85"/>
        <rect x="16" y="10" width="8" height="28" rx="3" fill="#FF6B35"/>
        <rect x="26" y="6" width="12" height="36" rx="4" fill="#FF6B35"/>
        <rect x="26" y="20" width="40" height="6" rx="2" fill="#FF6B35"/>
      </g>
      <text x="72" y="38" font-family="'Poppins', sans-serif" font-weight="900" font-size="28" letter-spacing="-1" fill="#FFFFFF">SIŁKA</text>
    </svg>
    <div class="silka-loader__bar"><div class="silka-loader__progress"></div></div>
    <p class="silka-loader__hint">Ładowanie...</p>
  </div>
</div>

<script>
function showLoader(){
  const el = document.getElementById('loader');
  el.classList.remove('silka-loader--hidden');
  setTimeout(()=>el.classList.add('silka-loader--hidden'), 1500);
}
window.addEventListener('load', ()=>{ setTimeout(()=>document.getElementById('loader').classList.add('silka-loader--hidden'), 800); });
</script>
</body>
</html>
