<svg width="420" height="80" viewBox="0 0 420 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="siłka logo with icon dark">
  <style>
    .bold { font-family: 'Poppins', Inter, sans-serif; font-weight: 800; }
  </style>
  <!-- Icon: dumbbell -->
  <g transform="translate(0,12)">
    <!-- bar -->
    <rect x="12" y="22" width="32" height="6" rx="2" fill="#FF6B35"/>
    <!-- left plates -->
    <rect x="2" y="14" width="10" height="22" rx="3" fill="#FF6B35"/>
    <rect x="0" y="18" width="4" height="14" rx="2" fill="#FF8C61"/>
    <!-- right plates -->
    <rect x="44" y="14" width="10" height="22" rx="3" fill="#FF6B35"/>
    <rect x="52" y="18" width="4" height="14" rx="2" fill="#FF8C61"/>
    <!-- accent dot -->
    <circle cx="28" cy="8" r="3" fill="#06B6D4"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="56" class="bold" font-size="56" letter-spacing="-2" font-weight="800" fill="#FFFFFF">SIŁKA</text>
  <!-- underline accent -->
  <rect x="68" y="62" width="48" height="4" rx="2" fill="#FF6B35"/>
</svg>
