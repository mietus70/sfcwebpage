<svg width="380" height="80" viewBox="0 0 380 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="siłka lowercase modern">
  <style>
    .bold { font-family: 'Poppins', Inter, sans-serif; font-weight: 800; }
  </style>
  <!-- lowercase friendly -->
  <text x="0" y="58" class="bold" font-size="62" letter-spacing="-2.5" font-weight="800">
    <tspan fill="#1E293B">sił</tspan><tspan fill="#FF6B35">ka</tspan>
  </text>
  <!-- accent: small barbell as dot over i? Actually siłka has no i dot, but we add dynamic underline -->
  <g transform="translate(88,8)">
    <rect x="0" y="0" width="18" height="4" rx="2" fill="#06B6D4"/>
    <rect x="4" y="6" width="10" height="3" rx="1.5" fill="#06B6D4" opacity="0.6"/>
  </g>
</svg>
