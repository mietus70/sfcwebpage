<svg width="400" height="96" viewBox="0 0 400 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="siłka animated logo large">
  <style>
    @keyframes lift {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-4px) scale(1.02); }
      75% { transform: translateY(1px) scale(0.99); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,107,53,0)); }
      50% { filter: drop-shadow(0 0 8px rgba(255,107,53,0.6)); }
    }
    @keyframes textReveal {
      from { opacity: 0; transform: translateX(-12px); clip-path: inset(0 100% 0 0); }
      to { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
    }
    @keyframes kaPulse {
      0%, 100% { fill: #FFFFFF; }
      50% { fill: #FF6B35; }
    }
    .dumbbell-group { animation: lift 2s ease-in-out infinite; transform-origin: 24px 20px; }
    .dumbbell-glow { animation: pulseGlow 2s ease-in-out infinite; }
    .text-group { animation: textReveal 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
    .ka-accent { animation: kaPulse 2s ease-in-out infinite 1s; }
  </style>
  <g class="dumbbell-group dumbbell-glow">
    <g transform="translate(0, 12)">
      <rect x="2" y="20" width="6" height="20" rx="2" fill="#FF6B35" opacity="0.7"/>
      <rect x="11" y="14" width="9" height="32" rx="3" fill="#FF6B35" opacity="0.85"/>
      <rect x="23" y="8" width="13" height="44" rx="4" fill="#FF6B35"/>
      <rect x="39" y="2" width="18" height="56" rx="5" fill="#FF6B35"/>
      <rect x="39" y="24" width="36" height="10" rx="2" fill="#FF6B35"/>
    </g>
  </g>
  <g class="text-group">
    <text x="84" y="66" font-family="'Poppins', Inter, sans-serif" font-weight="900" font-size="60" letter-spacing="-2" fill="#FFFFFF">SIŁKA</text>
  </g>
</svg>
